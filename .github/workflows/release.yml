# Release build, same layout as the other Studio 87 plugins: one zip with
#   windows/SupurrSaw-Setup.exe, macos/SupurrSaw-macOS.pkg, linux/ (.deb, .vst3 tarball, standalone Flatpak),
#   the PDF manual, INSTALL.txt, LICENSE and SHA256SUMS.
# Run it by hand (Actions tab, Run workflow) and type a tag like v0.2.6, or push a tag. Empty tag only builds.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release with this tag (for example v0.2.6). Leave empty to only build.'
        required: false
        default: ''
      skip_macos:
        description: 'Skip the macOS build (use only when the hosted macOS queue is stuck)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
env:
  TAGIN: ${{ inputs.tag }}
  NAME: SupurrSaw
  PRODUCT: "SupurrSaw"
  WV2: Microsoft.Web.WebView2.1.0.1901.177
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 package (static loader, nothing to install for users)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177 -OutFile wv2.zip
          Expand-Archive wv2.zip "webview2/$env:WV2"
      - name: Build
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; if echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then sed -i.bak -E "s/^(project\([A-Za-z0-9_]+ VERSION )[0-9.]+/\1$ver/" plugin/CMakeLists.txt; rm -f plugin/CMakeLists.txt.bak; fi
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$GITHUB_WORKSPACE/webview2"
          cmake --build build --config Release --parallel 4
      - name: Stage files
        run: |
          mkdir -p stage/vst3
          v=$(find build -type d -name "*.vst3" | head -1); echo "VST3: $v"
          cp -r "$v"/. "stage/vst3/"
          exe=$(find build -name "*.exe" -path "*Standalone*" | head -1); echo "EXE: $exe"
          cp "$exe" "stage/$PRODUCT.exe"
          cp docs/SupurrSaw_Manual.pdf "stage/$NAME-manual.pdf"
      - name: Installer (Inno Setup)
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || ver=0.0.1
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || { choco install innosetup -y --no-progress; }
          "$iscc" "//DName=$NAME" "//DProduct=$PRODUCT" "//DVersion=$ver" packaging/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "Output/*.exe"

  macos:
    if: ${{ inputs.skip_macos != true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal)
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; if echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then sed -i.bak -E "s/^(project\([A-Za-z0-9_]+ VERSION )[0-9.]+/\1$ver/" plugin/CMakeLists.txt; rm -f plugin/CMakeLists.txt.bak; fi
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release --parallel 4
      - name: Installer (.pkg)
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || ver=0.0.1
          id="io.github.speakingcolors.$(echo "$NAME" | tr 'A-Z' 'a-z')"
          v=$(find build -type d -name "*.vst3" | head -1); a=$(find build -type d -name "*.app" | head -1)
          echo "VST3: $v  APP: $a"
          mkdir -p root/vst3 root/app root/doc
          osacompile -o "root/app/Uninstall $PRODUCT.app" packaging/macos-uninstall.applescript
          cp -R "$v" root/vst3/; cp -R "$a" root/app/; cp docs/SupurrSaw_Manual.pdf "root/doc/$NAME-manual.pdf"
          codesign --force --deep -s - "root/vst3/$(basename "$v")"; codesign --force --deep -s - "root/app/$(basename "$a")"
          pkgbuild --root root/vst3 --identifier "$id.vst3" --version "$ver" --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root root/app --identifier "$id.app" --version "$ver" --install-location "/Applications" app.pkg
          pkgbuild --root root/doc --identifier "$id.doc" --version "$ver" --install-location "/Library/Application Support/Studio 87/$PRODUCT" doc.pkg
          productbuild --package vst3.pkg --package app.pkg --package doc.pkg "$NAME-macOS.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.pkg"

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev flatpak flatpak-builder
      - name: Build
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; if echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then sed -i.bak -E "s/^(project\([A-Za-z0-9_]+ VERSION )[0-9.]+/\1$ver/" plugin/CMakeLists.txt; rm -f plugin/CMakeLists.txt.bak; fi
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          mkdir -p payload out
          v=$(find build -type d -name "*.vst3" | head -1); echo "VST3: $v"; cp -R "$v" payload/
          s=$(find build -type f -name SupurrSaw -path "*Standalone*" | head -1); echo "APP: $s"; cp "$s" payload/SupurrSaw
          cp docs/SupurrSaw_Manual.pdf payload/SupurrSaw_Manual.pdf; cp LICENSE payload/LICENSE
          test -d payload/SupurrSaw.vst3 && test -f payload/SupurrSaw
      - name: Plain .vst3 tarball
        run: tar -C payload -czf "out/$NAME-linux-vst3.tar.gz" SupurrSaw.vst3
      - name: .deb for native DAWs
        run: |
          ver="${TAGIN:-$GITHUB_REF_NAME}"; ver="${ver#v}"; echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || ver=0.0.1
          D=debroot
          mkdir -p $D/DEBIAN $D/usr/bin $D/usr/lib/vst3 $D/usr/share/applications $D/usr/share/doc/supurrsaw $D/usr/share/icons/hicolor/256x256/apps
          cp -R payload/SupurrSaw.vst3 $D/usr/lib/vst3/
          install -m755 payload/SupurrSaw $D/usr/bin/supurrsaw
          install -m644 payload/SupurrSaw_Manual.pdf payload/LICENSE $D/usr/share/doc/supurrsaw/
          sed 's/^Icon=.*/Icon=supurrsaw/' release/linux/org.studio87.SupurrSaw.desktop > $D/usr/share/applications/supurrsaw.desktop
          cp release/linux/org.studio87.SupurrSaw.png $D/usr/share/icons/hicolor/256x256/apps/supurrsaw.png
          find $D -type d -exec chmod 755 {} +
          printf 'Package: supurrsaw\nVersion: %s\nSection: sound\nPriority: optional\nArchitecture: amd64\nDepends: libwebkit2gtk-4.1-0, libgtk-3-0, libasound2 | libasound2t64\nMaintainer: Studio 87 <noreply@users.noreply.github.com>\nHomepage: https://github.com/SpeakingColors/SupurrrSaw-VST\nDescription: SupurrSaw supersaw, hoover and acid synth (VST3 and standalone)\n Free and open source synthesizer by Studio 87. Installs the VST3 plugin\n into /usr/lib/vst3 and the standalone app as supurrsaw.\n' "$ver" > $D/DEBIAN/control
          dpkg-deb --root-owner-group --build $D "out/$NAME-linux.deb"
          dpkg-deb -I "out/$NAME-linux.deb"
      - name: Flatpak (standalone app)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47
          mkdir -p fp/payload
          cp payload/SupurrSaw payload/SupurrSaw_Manual.pdf payload/LICENSE fp/payload/
          cp release/linux/org.studio87.SupurrSaw.desktop release/linux/org.studio87.SupurrSaw.png fp/payload/
          cp release/linux/org.studio87.SupurrSaw.yml fp/
          cd fp
          flatpak-builder --user --force-clean --repo=repo build org.studio87.SupurrSaw.yml
          if flatpak build build ldd /app/bin/supurrsaw | grep "not found"; then echo "::error::missing libraries in the Flatpak runtime"; exit 1; fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "../out/$NAME-flatpak.flatpak" org.studio87.SupurrSaw
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "out/*"

  package:
    permissions:
      contents: write
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Assemble the zip
        run: |
          tag="$GITHUB_REF_NAME"; if [ "$GITHUB_REF_TYPE" != "tag" ]; then tag="${TAGIN:-dev}"; fi
          d="$NAME-$tag"; mkdir -p "$d/windows" "$d/macos" "$d/linux"
          cp parts/windows/*.exe "$d/windows/"
          if ls parts/macos/*.pkg >/dev/null 2>&1; then cp parts/macos/*.pkg "$d/macos/"; else rmdir "$d/macos"; fi
          cp parts/linux/* "$d/linux/"
          cp docs/SupurrSaw_Manual.pdf "$d/$NAME-manual.pdf"; cp LICENSE "$d/"
          cp packaging/INSTALL.txt "$d/INSTALL.txt"
          (cd "$d" && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS)
          zip -r "$d.zip" "$d"
          ls -l "$d.zip"; unzip -l "$d.zip"
          echo "TAG=$tag" >> "$GITHUB_ENV"; echo "ZIP=$d.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: "*.zip"
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file release/NOTES.md
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$PRODUCT $TAG" --notes-file release/NOTES.md
          fi
